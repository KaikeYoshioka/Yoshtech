<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wireframes · YoshTech</title>
<style>
  @page { size: A4; margin: 14mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Yu Gothic", "Segoe UI", sans-serif; color: #1D1F24; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  section { break-after: page; display: flex; flex-direction: column; height: calc(297mm - 28mm); }
  section:last-child { break-after: auto; }
  h1 { margin: 0 0 6mm; font-size: 22pt; font-weight: 900; }
  .img { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid #E7E8EB; }
</style>
</head>
<body>
  <section><h1>1 · Início</h1><div class="img"><img src="telas/1-inicio.png" alt="Wireframe da tela Início"></div></section>
  <section><h1>2 · Detalhes</h1><div class="img"><img src="telas/2-detalhes.png" alt="Wireframe da tela Detalhes"></div></section>
  <section><h1>3 · Gerenciar produtos</h1><div class="img"><img src="telas/3-gerenciar.png" alt="Wireframe da tela Gerenciar produtos"></div></section>
  <section><h1>4 · Cadastro, edição e exclusão</h1><div class="img"><img src="telas/4-cadastro-edicao-exclusao.png" alt="Wireframe dos modais de cadastro, edição e exclusão"></div></section>
  <section><h1>5 · Consultas</h1><div class="img"><img src="telas/5-consultas.png" alt="Wireframe da tela Consultas"></div></section>
</body>
</html>
